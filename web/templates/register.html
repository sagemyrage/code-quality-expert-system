{{define "content"}}
<div class="auth-wrap">
    <div class="auth-card">
        <h2>Регистрация</h2>
        <form method="post" action="/register">
            <div class="form-group">
                <label for="email">Почта</label>
                <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" required autocomplete="new-password" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="password_confirmation">Подтверждение пароля</label>
                <input id="password_confirmation" name="password_confirmation" type="password" required autocomplete="new-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
        </form>
        <p class="auth-footer">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</div>
{{end}}
